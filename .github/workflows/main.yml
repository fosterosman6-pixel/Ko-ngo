name: efuride_app
description: A comprehensive ride-hailing and delivery platform for South Africa
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0
  wakelock_plus: ^1.2.8
  android_intent_plus: ^5.2.0
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.0
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.4
  shared_preferences: ^2.2.2
  flutter_webrtc: ^0.12.5
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  google_maps_flutter: ^2.9.0
  image_picker: ^1.0.5
  path: ^1.9.0
  cached_network_image: ^4.0.0
  shimmer: ^4.0.0
  http: ^1.1.0
  intl: ^0.20.3
  connectivity_plus: ^7.3.1
  url_launcher: ^6.2.1
  share_plus: ^13.3.0
  uuid: ^4.5.1
  provider: ^6.1.1
  flutter_local_notifications: ^17.2.3
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - assets/fonts/
    - assets/ringtone.wav

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/efuride.png"
    background_color: "#FAF6EE"
    theme_color: "#1E88E5"
  image_path: "assets/icon/efuride.png"
  adaptive_icon_background: "#FAF6EE"
  adaptive_icon_foreground: "assets/icon/efuride.png"
  remove_alpha_ios: true
