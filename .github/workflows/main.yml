name: Build ko!ngo APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          mkdir proj
          unzip -q kongo_real_project.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get packages
        working-directory: proj
        run: flutter pub get
      - name: Build APK
        working-directory: proj
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: kongo-android
          path: proj/build/app/outputs/flutter-apk/*.apk
