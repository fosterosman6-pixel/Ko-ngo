name: Build ko!ngo Android (test)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project zip
        run: |
          mkdir proj
          unzip -q kongo_ci_full.zip -d proj
          ls proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add the Android part
        run: |
          mkdir /tmp/scaf && cd /tmp/scaf
          flutter create --org com.example --project-name efuride_deli_app --platforms=android .
          cd "$GITHUB_WORKSPACE/proj"
          cp -r /tmp/scaf/android android
          cp android_overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/raw
          cp android_overlay/res/raw/* android/app/src/main/res/raw/

      - name: Get packages
        working-directory: proj
        run: flutter pub get

      - name: Build phone APKs
        working-directory: proj
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: kongo-android
          path: proj/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
