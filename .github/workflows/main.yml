name: efuride_app
description: ko!ngo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  image_picker: ^1.1.2
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  latlong2: ^0.9.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  share_plus: ^10.1.2
  shimmer: ^3.0.0
  http: ^1.2.2
  android_intent_plus: ^5.2.0
  wakelock_plus: ^1.2.8
  speech_to_text: ^7.0.0
  flutter_webrtc: ^0.12.5
  flutter_tts: ^4.2.0
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/flags/
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic
